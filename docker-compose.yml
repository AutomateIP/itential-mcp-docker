version: '3.8'

services:
  # Itential MCP Server
  # Provides Model Context Protocol server for LLM integration with Itential Platform
  # Server URL: http://localhost:8000/sse (external) or http://itential-mcp:8000/sse (internal)
  itential-mcp:
    build:
      context: ../itential-mcp
      dockerfile: Containerfile
    container_name: itential-mcp-server
    ports:
      - "${ITENTIAL_MCP_PORT:-8000}:8000"
    environment:
      # Server Configuration
      ITENTIAL_MCP_SERVER_TRANSPORT: "${ITENTIAL_MCP_SERVER_TRANSPORT:-sse}"
      ITENTIAL_MCP_SERVER_HOST: "${ITENTIAL_MCP_SERVER_HOST:-0.0.0.0}"
      ITENTIAL_MCP_SERVER_PORT: "${ITENTIAL_MCP_SERVER_PORT:-8000}"
      ITENTIAL_MCP_SERVER_LOG_LEVEL: "${ITENTIAL_MCP_SERVER_LOG_LEVEL:-INFO}"
      
      # Tool Filtering (optional)
      ITENTIAL_MCP_SERVER_INCLUDE_TAGS: "${ITENTIAL_MCP_SERVER_INCLUDE_TAGS:-}"
      ITENTIAL_MCP_SERVER_EXCLUDE_TAGS: "${ITENTIAL_MCP_SERVER_EXCLUDE_TAGS:-experimental,beta}"
      
      # Itential Platform Connection
      ITENTIAL_MCP_PLATFORM_HOST: "${ITENTIAL_MCP_PLATFORM_HOST}"
      ITENTIAL_MCP_PLATFORM_PORT: "${ITENTIAL_MCP_PLATFORM_PORT:-0}"
      ITENTIAL_MCP_PLATFORM_DISABLE_TLS: "${ITENTIAL_MCP_PLATFORM_DISABLE_TLS:-false}"
      ITENTIAL_MCP_PLATFORM_DISABLE_VERIFY: "${ITENTIAL_MCP_PLATFORM_DISABLE_VERIFY:-false}"
      ITENTIAL_MCP_PLATFORM_TIMEOUT: "${ITENTIAL_MCP_PLATFORM_TIMEOUT:-30}"
      
      # Authentication - OAuth (recommended)
      ITENTIAL_MCP_PLATFORM_CLIENT_ID: "${ITENTIAL_MCP_PLATFORM_CLIENT_ID}"
      ITENTIAL_MCP_PLATFORM_CLIENT_SECRET: "${ITENTIAL_MCP_PLATFORM_CLIENT_SECRET}"
      
      # Authentication - Basic Auth (alternative)
      ITENTIAL_MCP_PLATFORM_USER: "${ITENTIAL_MCP_PLATFORM_USER:-}"
      ITENTIAL_MCP_PLATFORM_PASSWORD: "${ITENTIAL_MCP_PLATFORM_PASSWORD:-}"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    networks:
      - itential-mcp-network
    
    # Resource limits for production deployment
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  itential-mcp-network:
    driver: bridge
    name: itential-mcp-network
