services:
  # Itential MCP Server
  # Provides Model Context Protocol server for LLM integration with Itential Platform
  # Server URL: http://localhost:8000/mcp (external) or http://itential-mcp:8000/mcp (internal)
  itential-mcp:
    build:
      context: ../itential-mcp
      dockerfile: Containerfile
    container_name: itential-mcp-server
    ports:
      - "${ITENTIAL_MCP_PORT:-8000}:8000"
    volumes:
      - ./itential-mcp.conf:/app/itential-mcp.conf:ro
    environment:
      # Configuration file path
      ITENTIAL_MCP_CONFIG: "/app/itential-mcp.conf"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    networks:
      - itential-mcp-network
    
    # Resource limits for production deployment
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  itential-mcp-network:
    driver: bridge
    name: itential-mcp-network
